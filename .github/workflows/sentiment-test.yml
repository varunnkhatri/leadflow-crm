name: Sentiment verification
on:
  push:
    branches: [mca-ml-upgrade]
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python demo_sentiment.py
      - run: python sentiment.py demo_sentiment.csv --provenance "45 manually authored synthetic examples; demonstration only"
      - run: |
          python - <<'PY'
          import joblib
          m=joblib.load("artifacts/sentiment.joblib")
          assert set(m.classes_)=={"positive","neutral","negative"}
          assert len(m.predict(["Please share pricing"]))==1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sentiment-metrics
          path: ml/artifacts/sentiment_metrics.json
