[project]
name = "leadflow-ml"
version = "2.0.0"
description = "LeadFlow CRM academic ML inference microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "scikit-learn==1.6.1",
    "pandas==2.2.3",
    "numpy==2.2.5",
    "joblib==1.4.2",
]

[tool.vercel]
entrypoint = "api:app"

[tool.vercel.scripts]
build = "python build_artifacts.py"
